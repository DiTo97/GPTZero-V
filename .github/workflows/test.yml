name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: read

jobs:
  test-gptzero:
    name: Test GPTZero-o SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-packages --group dev
    
    - name: Run tests
      run: uv run --package gptzero-o-core pytest packages/gptzero-o-core/tests/ -v --cov=gptzero_o --cov-report=term-missing --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: packages/gptzero-o-core/coverage.xml
        flags: gptzero-o-core
        name: gptzero-o-core-coverage
      if: always()

  test-api:
    name: Test GPTZero-o API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-packages --group dev
    
    - name: Run linting
      run: uv run --package gptzero-o-api ruff check packages/gptzero-o-api/src/

  test-sdk:
    name: Test GPTZero-o SDK Client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-packages --group dev
    
    - name: Run linting
      run: uv run --package gptzero-o-sdk ruff check packages/gptzero-o-sdk/src/

  lint:
    name: Lint All Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
    
    - name: Set up Python
      run: uv python install 3.11
    
    - name: Install dependencies
      run: uv sync --all-packages --group dev
    
    - name: Lint gptzero-o-core
      run: uv run ruff check packages/gptzero-o-core/src/ packages/gptzero-o-core/tests/
    
    - name: Lint gptzero-o-api
      run: uv run ruff check packages/gptzero-o-api/src/
    
    - name: Lint gptzero-o-sdk
      run: uv run ruff check packages/gptzero-o-sdk/src/
    
    - name: Lint gptzero-o-service
      run: uv run ruff check packages/gptzero-o-service/src/
