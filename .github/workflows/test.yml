name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]

permissions:
  contents: read

jobs:
  test-gptzero:
    name: Test GPTZero SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd packages/gptzero
        pip install -e ".[dev]"
    
    - name: Run tests
      run: |
        cd packages/gptzero
        pytest tests/ -v --cov=gptzero --cov-report=term-missing --cov-report=xml
    
    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: packages/gptzero/coverage.xml
        flags: gptzero
        name: gptzero-coverage
      if: always()

  test-api:
    name: Test GPTZero API
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd packages/gptzero
        pip install -e .
        cd ../gptzero-api
        pip install -e ".[dev]"
    
    - name: Run linting
      run: |
        cd packages/gptzero-api
        ruff check src/

  test-sdk:
    name: Test GPTZero SDK Client
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd packages/gptzero-sdk
        pip install -e ".[dev]"
    
    - name: Run linting
      run: |
        cd packages/gptzero-sdk
        ruff check src/

  lint:
    name: Lint All Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install ruff
      run: pip install ruff
    
    - name: Lint gptzero
      run: |
        cd packages/gptzero
        ruff check src/ tests/
    
    - name: Lint gptzero-api
      run: |
        cd packages/gptzero-api
        ruff check src/
    
    - name: Lint gptzero-sdk
      run: |
        cd packages/gptzero-sdk
        ruff check src/
    
    - name: Lint gptzero-service
      run: |
        cd packages/gptzero-service
        ruff check src/
