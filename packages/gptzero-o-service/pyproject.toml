[project]
name = "gptzero-o-service"
version = "0.1.0"
description = "Streamlit frontend for GPTZero-o media content authenticity verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Federico Minutoli", email = "fede97.minutoli@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "streamlit>=1.0.0,<2",
    "plotly>=6.0.0",
    "gptzero-o-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/components"]

[tool.uv.sources]
gptzero-o-sdk = { workspace = true }

[tool.ruff]
src = ["src"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "B", "C4", "SIM"]
ignore = ["E501"]  # Ignore line length for UI strings

[tool.ruff.lint.isort]
known-first-party = ["components"]
lines-after-imports = 2
