[project]
name = "gptzero-o-sdk"
version = "0.1.0"
description = "Python SDK for GPTZero-o API"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Federico Minutoli", email = "fede97.minutoli@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "httpx>=0.26.0",
    "pydantic>=2.0.0",
    "gptzero-o-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptzero_o_sdk"]

[tool.uv.sources]
gptzero-o-core = { workspace = true }

[tool.ruff]
src = ["src"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gptzero_o_sdk"]
lines-after-imports = 2
