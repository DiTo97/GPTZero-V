[project]
name = "gptzero-o-core"
version = "0.1.0"
description = "GPTZero-o SDK for media content authenticity verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Federico Minutoli", email = "fede97.minutoli@gmail.com"}]
license = {text = "MIT"}
keywords = ["content-authenticity", "media-verification", "metadata", "c2pa", "exif"]

dependencies = [
    "c2pa-python>=0.27.0,<1.0.0",
    "exif>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptzero_o"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=gptzero_o",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.ruff]
src = ["src"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "YTT",
    "B",
    "C4",
    "SIM",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gptzero_o"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
