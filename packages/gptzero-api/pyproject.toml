[project]
name = "gptzero-api"
version = "0.1.0"
description = "FastAPI service for GPTZero-V image authenticity verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Federico Minutoli", email = "fede97.minutoli@gmail.com"}]
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "gptzero",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gptzero_api"]

[tool.uv.sources]
gptzero = { workspace = true }

[project.scripts]
gptzero-api = "gptzero_api.api:main"

[tool.ruff]
src = ["src"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["gptzero_api"]
lines-after-imports = 2
